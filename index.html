<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Age calculator with Sadek and CodeAlpa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- here is my code begain -->
    <div id="mainDiv">
      <div id="headlineDiv">
        <h1>Age Calculator</h1>
        <p>
          Easily calculate your exact age by entering your date of birth. This
          simple Age Calculator will show your age in years, months, and days
          based on the current date. Just select your birth date and click the
          check button to instantly see your age.
        </p>
      </div>
      <!-- for input  -->
      <div id="formDiv">
        <form id="inputForm" action="">
          <input
            id="inputDate"
            type="date"
            placeholder="write your age"
            required
          />
          <button id="submitBtn" type="submit">check</button>
        </form>
      </div>
      <div id="resultDiv">
        <ul id="relsultList"></ul>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
